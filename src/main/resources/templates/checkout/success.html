<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Заказ принят — Дом посуды</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<header th:replace="~{fragments/header :: header('')}"></header>

<main class="container">
    <div class="success-box">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 11 15 16 9"/>
        </svg>
        <h1>Спасибо за заказ!</h1>
        <p>Номер вашего заказа — <strong th:text="'№' + ${order.number}">№000001</strong></p>
        <p>Мы свяжемся с вами в ближайшее время для подтверждения.</p>

        <div class="success-details">
            <div class="summary-row">
                <span>Имя:</span>
                <span th:text="${order.customerName}">Иван</span>
            </div>
            <div class="summary-row">
                <span>Телефон:</span>
                <span th:text="${order.customerPhone}">+996…</span>
            </div>
            <div class="summary-row">
                <span>Город:</span>
                <span th:text="${order.city}">Бишкек</span>
            </div>
            <div class="summary-row">
                <span>Доставка:</span>
                <span th:text="${order.deliveryMethod.title}">Курьером</span>
            </div>
            <div class="summary-row summary-total">
                <span>Сумма:</span>
                <span th:text="${#numbers.formatDecimal(order.total, 1, 0)} + ' с'">0 с</span>
            </div>
        </div>

        <a href="/catalog" class="btn btn-primary" style="margin-top: 24px;">Продолжить покупки</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
