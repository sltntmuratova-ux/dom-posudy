<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head('Страница не найдена', ${settings.seoDescription})}"></head>
<body>

<header th:replace="~{fragments/header :: header('')}"></header>

<main class="container" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 60px 20px;">
    <h1 style="font-size: 120px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 10px;">404</h1>
    <h2 style="font-family: var(--font-serif); font-size: 32px; margin-bottom: 16px;">Ой! Такой страницы нет</h2>
    <p style="color: var(--text-muted); margin-bottom: 32px; max-width: 500px;">
        Возможно, товар был удален, или вы ошиблись в адресе. Но у нас есть много другой красивой посуды!
    </p>
    <a href="/catalog" class="btn btn-primary btn-lg">Вернуться в каталог</a>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
