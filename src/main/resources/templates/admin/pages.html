<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Страницы — админка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="admin-body">

<div class="admin-layout">
    <div th:replace="~{admin/_sidebar :: sidebar('pages')}"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1 class="admin-title">Информационные страницы</h1>
                <p class="admin-subtitle" th:text="${pages.size()} + ' страниц'">0 страниц</p>
            </div>
            <a href="/admin/pages/new" class="btn btn-primary">+ Добавить страницу</a>
        </div>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>URL</th>
                    <th style="text-align:center;">В футере</th>
                    <th style="text-align:center;">Опубликована</th>
                    <th style="text-align:right; width:180px;">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pages}">
                    <td style="font-weight: 600;" th:text="${p.title}">Доставка</td>
                    <td>
                        <code style="background: #f0ebe3; padding: 2px 8px; border-radius: 4px; font-size: 13px;"
                              th:text="'/p/' + ${p.slug}">/p/delivery</code>
                    </td>
                    <td style="text-align:center;">
                        <span th:if="${p.showInFooter}" class="badge badge-ok">Да</span>
                        <span th:if="${!p.showInFooter}" class="badge">Нет</span>
                    </td>
                    <td style="text-align:center;">
                        <span th:if="${p.published}" class="badge badge-ok">Да</span>
                        <span th:if="${!p.published}" class="badge badge-warn">Нет</span>
                    </td>
                    <td style="text-align:right;">
                        <a th:href="'/p/' + ${p.slug}" target="_blank" class="admin-btn-icon" title="Открыть">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                <polyline points="15 3 21 3 21 9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                        </a>
                        <a th:href="@{/admin/pages/{id}/edit(id=${p.id})}" class="admin-btn-icon" title="Редактировать">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </a>
                        <form th:action="@{/admin/pages/{id}/delete(id=${p.id})}" method="post"
                              style="display:inline;" onsubmit="return confirm('Удалить страницу?');">
                            <button type="submit" class="admin-btn-icon admin-btn-danger" title="Удалить">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                </svg>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${pages.isEmpty()}" class="empty" style="padding: 60px 20px;">
                <h3>Страниц пока нет</h3>
                <p>Нажмите «+ Добавить страницу», чтобы создать «Доставка», «О нас» и т.д.</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
