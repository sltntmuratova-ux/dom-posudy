<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Товары — Дом посуды</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="admin-body">

<div class="admin-layout">

    <div th:replace="~{admin/_sidebar :: sidebar('products')}"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1 class="admin-title">Товары</h1>
                <p class="admin-subtitle" th:text="${products.size()} + ' позиций'">0 позиций</p>
            </div>
            <a href="/admin/products/new" class="btn btn-primary">+ Добавить товар</a>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:70px;">Фото</th>
                    <th>Название</th>
                    <th>Категория</th>
                    <th style="text-align:right;">Цена</th>
                    <th style="text-align:center;">Остаток</th>
                    <th style="text-align:right; width:150px;">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <img th:src="${p.imageUrl}" th:alt="${p.name}" class="admin-thumb"/>
                    </td>
                    <td>
                        <div class="admin-product-name" th:text="${p.name}">Название</div>
                        <div class="admin-product-slug" th:text="${p.slug}">slug</div>
                    </td>
                    <td th:text="${p.category != null ? p.category.name : '—'}">Категория</td>
                    <td style="text-align:right; font-weight:600;"
                        th:text="${#numbers.formatDecimal(p.price, 1, 0)} + ' с'">0 с</td>
                    <td style="text-align:center;">
                        <span class="badge" th:classappend="${p.stock < 10} ? 'badge-warn' : 'badge-ok'"
                              th:text="${p.stock}">0</span>
                    </td>
                    <td style="text-align:right;">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="admin-btn-icon" title="Редактировать">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </a>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" style="display:inline;" class="delete-form">
                            <button type="submit" class="admin-btn-icon admin-btn-danger" title="Удалить">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                </svg>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${products.isEmpty()}" class="empty" style="padding: 60px 20px;">
                <h3>Товаров пока нет</h3>
                <p>Нажмите «+ Добавить товар», чтобы создать первый.</p>
            </div>
        </div>
    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const deleteForms = document.querySelectorAll('.delete-form');
        deleteForms.forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Останавливаем мгновенное удаление
                Swal.fire({
                    title: 'Вы уверены?',
                    text: "Это действие нельзя будет отменить!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#6b7f5e',
                    confirmButtonText: 'Да, удалить',
                    cancelButtonText: 'Отмена'
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.submit(); // Отправляем, если нажали "Да"
                    }
                });
            });
        });
    });
</script>
</body>
</html>
