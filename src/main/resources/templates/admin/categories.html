<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Категории — Дом посуды</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="admin-body">

<div class="admin-layout">

    <div th:replace="~{admin/_sidebar :: sidebar('categories')}"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1 class="admin-title">Категории</h1>
                <p class="admin-subtitle" th:text="${categories.size()} + ' категорий'">0 категорий</p>
            </div>
            <a href="/admin/categories/new" class="btn btn-primary">+ Добавить категорию</a>
        </div>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:60px;">ID</th>
                    <th>Название</th>
                    <th>Slug (URL)</th>
                    <th style="text-align:center;">Порядок</th>
                    <th style="text-align:right; width:150px;">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.id}">1</td>
                    <td style="font-weight: 600;" th:text="${c.name}">Тарелки</td>
                    <td>
                        <code style="background: #f0ebe3; padding: 2px 8px; border-radius: 4px; font-size: 13px;"
                              th:text="${c.slug}">plates</code>
                    </td>
                    <td style="text-align:center;" th:text="${c.sortOrder}">0</td>
                    <td style="text-align:right;">
                        <a th:href="@{/admin/categories/{id}/edit(id=${c.id})}" class="admin-btn-icon" title="Редактировать">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </a>
                        <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                              style="display:inline;" onsubmit="return confirm('Удалить категорию?');">
                            <button type="submit" class="admin-btn-icon admin-btn-danger" title="Удалить">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                </svg>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

</body>
</html>
