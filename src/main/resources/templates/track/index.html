<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head('Мои заказы', ${settings.seoDescription})}"></head>
<body>

<header th:replace="~{fragments/header :: header('track')}"></header>

<main class="container" style="padding-top: 40px; min-height: 60vh;">
    <h1 class="page-title" style="text-align: center; margin-bottom: 32px;">Мои заказы</h1>

    <div style="max-width: 500px; margin: 0 auto 40px;">
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">
            Введите номер телефона, который вы указывали при оформлении заказа.
        </p>
        <form th:action="@{/track}" method="post" class="search-form" style="max-width: 100%;">
            <input type="text" name="phone" th:value="${phone}" placeholder="Например: +996555123456" required/>
            <button type="submit">Найти</button>
        </form>
    </div>

    <!-- РЕЗУЛЬТАТЫ ПОИСКА -->
    <div th:if="${orders != null}">

        <!-- Если ничего не найдено -->
        <div class="empty" th:if="${orders.isEmpty()}" style="padding: 40px 20px; background: var(--surface); border-radius: var(--radius);">
            <h3>Заказы не найдены</h3>
            <p>Проверьте правильность ввода номера телефона.</p>
        </div>

        <!-- Список заказов -->
        <div th:unless="${orders.isEmpty()}" style="max-width: 800px; margin: 0 auto;">
            <div class="form-card" th:each="o : ${orders}" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
                    <div>
                        <h3 style="margin-bottom: 4px;" th:text="'Заказ №' + ${o.number}">№000001</h3>
                        <span style="color: var(--text-muted); font-size: 14px;"
                              th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</span>
                    </div>
                    <div style="text-align: right;">
                        <span class="badge"
                              th:classappend="${o.status.name() == 'NEW' ? 'badge-new' :
                                                (o.status.name() == 'DONE' ? 'badge-ok' :
                                                (o.status.name() == 'CANCELLED' ? 'badge-danger' : 'badge-warn'))}"
                              th:text="${o.status.title}">Новый</span>
                        <div style="font-weight: 700; font-size: 18px; margin-top: 8px; color: var(--primary);"
                             th:text="${#numbers.formatDecimal(o.total, 1, 0)} + ' ' + ${settings.currency}">0 с</div>
                    </div>
                </div>

                <!-- Состав заказа -->
                <div style="font-size: 14px;">
                    <div th:each="item : ${o.items}" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span th:text="${item.productName} + ' × ' + ${item.quantity}">Товар x1</span>
                        <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 0)} + ' ' + ${settings.currency}">0 с</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
