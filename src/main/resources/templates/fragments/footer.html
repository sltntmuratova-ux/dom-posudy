<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <div class="footer-grid">
            <div>
                <div class="logo" style="margin-bottom: 12px;" th:text="${settings.shopName}">Дом посуды</div>
                <p style="color: var(--text-muted); font-size: 14px;">
                    Керамика, фарфор, чугун. Для тех, кто любит готовить и накрывать стол.
                </p>
            </div>

            <div>
                <h4>Магазин</h4>
                <a href="/catalog">Каталог</a>
                <a href="/catalog?category=plates">Тарелки</a>
                <a href="/catalog?category=cups">Чашки</a>
                <a href="/catalog?category=pots">Кастрюли</a>
            </div>

            <div>
                <h4>Информация</h4>
                <a th:each="p : ${footerPages}"
                   th:href="'/p/' + ${p.slug}"
                   th:text="${p.title}">Страница</a>
            </div>

            <div>
                <h4>Контакты</h4>
                <a th:href="'tel:' + ${settings.phone}" th:text="${settings.phone}">+996...</a>
                <a th:href="'mailto:' + ${settings.email}" th:text="${settings.email}">email</a>
                <a href="#" th:text="${settings.address}">адрес</a>
            </div>
        </div>

        <div class="footer-bottom">
            <span th:text="'© 2026 ' + ${settings.shopName} + '. Все права защищены.'">© 2026</span>
            <span th:if="${!#strings.isEmpty(settings.requisites)}"
                  style="display:block; margin-top: 6px; font-size: 12px; color: var(--text-muted);"
                  th:text="${settings.requisites}"></span>
            <a href="/login" style="color: var(--text-muted); margin-left: 12px; font-size: 12px;">Вход для админа</a>
        </div>
    </div>
</footer>

</body>
</html>
