<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header(active)" class="site-header">
    <div class="container header-inner">
        <a href="/" class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <!-- Иконка чайника со стимом -->
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                <line x1="6" y1="1" x2="6" y2="4"/>
                <line x1="10" y1="1" x2="10" y2="4"/>
                <line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
            <span th:text="${settings.shopName}">Дом посуды</span>
        </a>

        <nav class="main-nav">
            <a href="/" th:classappend="${active == 'home'} ? 'active'">Главная</a>
            <a href="/catalog" th:classappend="${active == 'catalog'} ? 'active'">Каталог</a>
            <a href="/track" th:classappend="${active == 'track'} ? 'active'">Мои заказы</a>
            <a href="/cart" class="cart-link" th:classappend="${active == 'cart'} ? 'active'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
                </svg>
                Корзина <span th:if="${cartCount > 0}" th:text="'(' + ${cartCount} + ')'" style="color: var(--primary); font-weight: 600;"></span>
            </a>
        </nav>
    </div>
</header>

</body>
</html>
