<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- Заголовок страницы -->
    <title th:text="${title} + ' — ' + ${settings.shopName}">Дом посуды</title>

    <!-- Мета-теги для поисковиков -->
    <meta name="description" th:content="${description != null ? description : settings.seoDescription}"/>
    <meta name="keywords" th:content="${settings.seoKeywords}"/>

    <!-- Open Graph (для красивого отображения в WhatsApp и Telegram) -->
    <meta property="og:title" th:content="${title} + ' — ' + ${settings.shopName}"/>
    <meta property="og:description" th:content="${description != null ? description : settings.seoDescription}"/>
    <meta property="og:type" content="website"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body></body>
</html>
